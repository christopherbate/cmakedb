[workspace]
resolver = "2"
members = [
    "crates/cmakedb-syntax",
    "crates/cmakedb-record",
    "crates/cmakedb-db",
    "crates/cmakedb-passes",
    "crates/cmakedb-lsp",
    "crates/cmakedb-patch",
    "crates/cmakedb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christopherbate/cmakedb"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-cmake = "0.7"
toml = "0.9"
regex = "1"
rayon = "1"
sha2 = "0.10"
tempfile = "3"

cmakedb-syntax = { path = "crates/cmakedb-syntax" }
cmakedb-record = { path = "crates/cmakedb-record" }
cmakedb-db = { path = "crates/cmakedb-db" }
cmakedb-passes = { path = "crates/cmakedb-passes" }
cmakedb-patch = { path = "crates/cmakedb-patch" }
cmakedb-lsp = { path = "crates/cmakedb-lsp" }

[profile.release]
lto = "thin"
