name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Supply chain: license policy + RUSTSEC advisories (deny.toml). This is
  # the gate that catches a dependency going vulnerable without anyone
  # watching — deny.toml's ignore list is deliberately empty.
  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Minimum supported Rust version, declared in workspace.package. Checked
  # rather than tested: the point is that the crate still compiles on the
  # floor, and dev-dependencies may legitimately want more.
  msrv:
    name: msrv (rust 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  # The VS Code extension, exercised in a real (headless) VS Code instance:
  # activation, contributed commands, and a live language-client round trip
  # against a real recording. Needs xvfb because VS Code is an Electron app,
  # and needs the cmakedb binary because `cmakedb lsp` is post-mortem — the
  # test workspace is recorded before the tests run.
  vscode-extension:
    name: vscode extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --version
      - name: Build the server the extension drives
        run: cargo build -p cmakedb-cli --locked
      - run: npm ci
        working-directory: editors/vscode
      - run: xvfb-run -a npm test
        working-directory: editors/vscode

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test suite records real cmake configures (design §6.1): it needs
      # cmake >= 3.25 (the `global_frame` floor, pinned by the cmake-compat
      # job below) and ninja on PATH.
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake --version && ninja --version
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Ingestion throughput floor (§6.6)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --release --locked -p cmakedb-db --test perf_floor -- --ignored --nocapture

  # Oldest-supported CMake (§5.4): the modern leg above runs whatever the
  # runner image ships; this leg pins the floor. Divergence here means the
  # trace format or File API drifted.
  cmake-compat:
    name: cmake ${{ matrix.cmake }} (oldest supported)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cmake: ["3.25.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install pinned CMake
        run: |
          curl -sL -o cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v${{ matrix.cmake }}/cmake-${{ matrix.cmake }}-linux-x86_64.tar.gz
          tar xzf cmake.tar.gz
          echo "$PWD/cmake-${{ matrix.cmake }}-linux-x86_64/bin" >> $GITHUB_PATH
      - run: cmake --version
      - run: cargo test --workspace --locked

  # Experimental: cmakedb has never been exercised on Windows (§6.5 path
  # audit is open). Non-blocking; failures here are data, not gate.
  windows-experimental:
    name: test (windows, experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: choco install ninja -y
      - run: cmake --version && ninja --version
      - run: cargo test --workspace --locked
