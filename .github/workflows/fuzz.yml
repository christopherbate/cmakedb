name: Fuzz

# Coverage-guided fuzzing (design §6.5). Weekly plus on demand; the same
# invariants run in every CI test job via the seeded mutator in
# crates/cmakedb-db/tests/robustness.rs.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [parse_roundtrip, trace_ingest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
        working-directory: fuzz
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
